[project]
name = "pollbench"
version = "0.0.0"
description = "Rating AI benchmarks the way pollsters are rated: out-of-sample predictability, calibrated error and audit quality, with uncertainty"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "numpyro>=0.19.0",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pollbench"]
